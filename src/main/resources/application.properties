spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# === Datasource ===
# Para Neon: jdbc:postgresql://<neon-host>/<database>?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hmap_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
# El esquema lo controla Flyway; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Carga en lote de colecciones (@ElementCollection de Room) para evitar N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# === Seguridad / JWT ===
api.security.token.secret=${JWT_SECRET:12345678}

# === Correo (SMTP - Mailtrap) ===
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@hmap.com}


# === Frontend ===
# Base del enlace incluido en el correo de recuperacion de contrasena
app.frontend.reset-password-url=${FRONTEND_RESET_URL:http://localhost:5173/reset-password}
# Minutos de validez del token de recuperacion
app.security.reset-token.expiration-minutes=${RESET_TOKEN_MINUTES:30}

# === Reservas ===
# Horas antes del check-in hasta las que el cliente puede editar/cancelar su reserva
app.reservations.edit-window-hours=${RESERVATION_EDIT_WINDOW_HOURS:48}

# === Imagenes ===
# Base publica del CDN de imagenes (Cloudinary). La BD guarda rutas relativas
# (hmap/rooms/<slug>/<nombre>) y la API antepone esta base al servirlas.
# Ej: https://res.cloudinary.com/tu_cloud/image/upload
app.images.base-url=${IMAGES_BASE_URL:}
