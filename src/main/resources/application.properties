spring.application.name=backend

# === Profile activo ===
# dev: Desarrollo local con PostgreSQL local
# prod: Producción (Render + Supabase)
spring.profiles.active=${SPRING_PROFILE:dev}

# Importar .env si existe (opcional, para sobrescribir valores)
spring.config.import=optional:file:.env[.properties]

# === Datasource ===
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
# El esquema lo controla Flyway; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Carga en lote de colecciones (@ElementCollection de Room) para evitar N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# === Seguridad / JWT ===
api.security.token.secret=${JWT_SECRET:12345678}

# === Correo (SMTP - Mailtrap) ===
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@hmap.com}


# === Frontend ===
# Base del enlace incluido en el correo de recuperacion de contrasena
app.frontend.reset-password-url=${FRONTEND_RESET_URL:http://localhost:5173/reset-password}
# Minutos de validez del token de recuperacion
app.security.reset-token.expiration-minutes=${RESET_TOKEN_MINUTES:30}

# === Reservas ===
# Horas antes del check-in hasta las que el cliente puede editar/cancelar su reserva
app.reservations.edit-window-hours=${RESERVATION_EDIT_WINDOW_HOURS:48}

# === Imagenes ===
# Base publica del CDN de imagenes (Cloudinary). La BD guarda rutas relativas
# (hmap/rooms/<slug>/<nombre>) y la API antepone esta base al servirlas.
# Ej: https://res.cloudinary.com/tu_cloud/image/upload
app.images.base-url=${IMAGES_BASE_URL:}

# === Actuator (health check) ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Deshabilitar health check de mail (timeout en Render)
management.health.mail.enabled=false
