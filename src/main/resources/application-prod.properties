# === Perfil de PRODUCCIÓN ===

# === Base de datos (Supabase) ===
# Se configuran desde variables de entorno en Render
DATABASE_URL=${DATABASE_URL}
DATABASE_USERNAME=${DATABASE_USERNAME}
DATABASE_PASSWORD=${DATABASE_PASSWORD}

# === JWT ===
JWT_SECRET=${JWT_SECRET}

# === Correo (producción - SMTP real) ===
MAIL_HOST=${MAIL_HOST}
MAIL_PORT=${MAIL_PORT}
MAIL_USERNAME=${MAIL_USERNAME}
MAIL_PASSWORD=${MAIL_PASSWORD}
MAIL_FROM=${MAIL_FROM:no-reply@hmap.com}

# === Frontend (Vercel) ===
FRONTEND_RESET_URL=${FRONTEND_RESET_URL:https://hmap-front.vercel.app/reset-password}

# === Imágenes (Cloudinary) ===
IMAGES_BASE_URL=${IMAGES_BASE_URL}

# === Configuración de producción ===
RESERVATION_EDIT_WINDOW_HOURS=${RESERVATION_EDIT_WINDOW_HOURS:48}
RESET_TOKEN_MINUTES=${RESET_TOKEN_MINUTES:30}

# === Logging optimizado para producción ===
logging.level.com.hmap.backend=INFO
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === Actuator - solo health check ===
management.endpoint.health.show-details=never
